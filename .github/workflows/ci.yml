name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      pty_filter:
        description: "Run only tui_e2e tests matching this filter (empty = full suite)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # The suite includes real-binary PTY journeys; keep parallelism modest so
  # timing-sensitive terminal tests stay reliable on shared runners.
  RUST_TEST_THREADS: "2"
  RAYON_NUM_THREADS: "2"

jobs:
  lint:
    name: fmt and clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings

  installer:
    name: installer scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: bash -n scripts/install.sh && bash -n scripts/package-release.sh
      - run: shellcheck scripts/install.sh scripts/package-release.sh

  test:
    name: cargo test (code, provider and PTY suites)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # PTY tests run headless: portable-pty allocates its own pseudo-terminal
      # and the tests use an offline fake gh, so no TTY or GitHub login is
      # needed. test-all.mjs runs `cargo test --locked --all-targets` with the
      # test-only Git environment (foreground automatic maintenance).
      - if: ${{ inputs.pty_filter == '' }}
        run: node scripts/test-all.mjs
        env:
          # The real-TLS workflow-edit push journeys (TASK-54) pass locally
          # but are fenced before the push on hosted runners; TASK-83 tracks
          # making them runner-safe. They still run in the local gate.
          GHTUI_CI_SKIP: "task54_workflow_edit_v9::remote_v9::"
      # Targeted diagnosis of runner-only failures without the full suite.
      - if: ${{ inputs.pty_filter != '' }}
        run: cargo test --locked --test tui_e2e -- "$FILTER"
        env:
          FILTER: ${{ inputs.pty_filter }}
          GIT_CONFIG_COUNT: "2"
          GIT_CONFIG_KEY_0: maintenance.autoDetach
          GIT_CONFIG_VALUE_0: "false"
          GIT_CONFIG_KEY_1: gc.autoDetach
          GIT_CONFIG_VALUE_1: "false"
      - name: Node script tests
        if: ${{ inputs.pty_filter == '' }}
        run: node --test tests/test_env.test.mjs tests/test_task_runner.test.mjs
