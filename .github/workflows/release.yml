name: Release

# Pushing a tag such as v0.1.0 builds static Linux binaries, verifies them and
# the installer against the assembled assets, then publishes a GitHub release.
# workflow_dispatch is a dry run: it builds, verifies and assembles the
# assets for the Cargo.toml version but never creates a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: build ${{ matrix.target }}
    # Each target builds on a runner of the same CPU so the binary can be
    # executed (--version smoke test) before it is packaged.
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Resolve the release tag
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            echo "RELEASE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
            echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"
          fi
      - name: Check the tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          test "v$version" = "$RELEASE_TAG" || {
            echo "tag $RELEASE_TAG does not match Cargo.toml version $version" >&2
            exit 1
          }
      - uses: dtolnay/rust-toolchain@1.93.1
        with:
          targets: ${{ matrix.target }}
      # cargo-zigbuild uses zig as the musl C compiler and linker for the
      # bundled SQLite and other C sources, producing fully static binaries.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo zigbuild --locked --release --bin ghtui --target ${{ matrix.target }}
      - name: Verify the binary is static and reports the tag version
        run: |
          binary=target/${{ matrix.target }}/release/ghtui
          file "$binary"
          file "$binary" | grep -Eq 'statically linked|static-pie linked'
          test "$("$binary" --version)" = "ghtui ${RELEASE_TAG#v}"
      - name: Package
        run: scripts/package-release.sh archive "$RELEASE_TAG" ${{ matrix.target }} target/${{ matrix.target }}/release/ghtui dist
      - uses: actions/upload-artifact@v4
        with:
          name: ghtui-${{ matrix.target }}
          path: dist/ghtui-*.tar.gz
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Resolve the release tag
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            echo "RELEASE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
            echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: ghtui-*
          path: dist
          merge-multiple: true
      - name: Write install.sh, release-version.txt and SHA256SUMS
        run: scripts/package-release.sh finish "$RELEASE_TAG" dist
      - name: Install from the assembled assets before publishing
        run: |
          release=$(mktemp -d)
          mkdir -p "$release/download/$RELEASE_TAG" "$release/latest/download"
          cp dist/* "$release/download/$RELEASE_TAG/"
          cp dist/* "$release/latest/download/"
          bash dist/install.sh --release-base "file://$release" --install-dir "$RUNNER_TEMP/bin"
          test "$("$RUNNER_TEMP/bin/ghtui" --version)" = "ghtui ${RELEASE_TAG#v}"
      - name: Create the GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag like v0.2.0-rc.1 is published as a prerelease, so the
          # installer's latest/download URLs keep pointing at the last stable tag.
          prerelease=
          case "$RELEASE_TAG" in *-*) prerelease=--prerelease ;; esac
          gh release create "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "ghtui $RELEASE_TAG" \
            --generate-notes \
            --verify-tag $prerelease
