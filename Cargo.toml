[package]
name = "ghtui"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "A fast, clear Git and GitHub terminal workspace"
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.22.1"
# Unix level-triggered polling keeps simultaneous resize/input readiness usable.
# The supported backend is upstream code, not a local vendor-source patch.
crossterm = { version = "0.29", default-features = false, features = ["events", "bracketed-paste", "use-dev-tty"] }
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ignore = "0.4"
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
nucleo-matcher = "0.3"
# Exact already-pinned Unix PTY/parser sources; optional external viewers only.
# No external renderer/pager is an application or installer dependency.
portable-pty = "=0.9.0"
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29", "layout-cache", "underline-color"] }
regex = "1"
# The official bundled 3.51.3 includes SQLite's WAL-reset integrity fix.
# Preserve the previous checked unsigned SQL conversions and default cache.
rusqlite = { version = "=0.39.0", features = ["bundled", "fallible_uint"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10.6"
sha2 = "0.10"
shell-words = "1"
tempfile = "3"
tantivy = { version = "0.26", default-features = false, features = ["mmap"] }
toml = "1"
unicode-segmentation = "1"
vt100 = "=0.15.2"
yaml-rust2 = { version = "0.11", default-features = false }
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
debug = 0

[profile.test]
debug = 0

# Keep the growing code/PTY test crates below the development-host memory
# high-water mark even with incremental compilation disabled. Restrict this
# partitioning to ghtui: dependency build settings and release output stay put.
[profile.dev.package.ghtui]
codegen-units = 256

[profile.test.package.ghtui]
codegen-units = 256

# Verified upstream source pins and manifest-only platform reductions are documented
# in vendor/upstream-sources.json and vendor/README.md.
[patch.crates-io]
sha1 = { path = "vendor/upstream/sha1" }
ratatui = { path = "vendor/upstream/ratatui/ratatui" }
ratatui-core = { path = "vendor/upstream/ratatui/ratatui-core" }
ratatui-crossterm = { path = "vendor/upstream/ratatui/ratatui-crossterm" }
ratatui-widgets = { path = "vendor/upstream/ratatui/ratatui-widgets" }
